[package]
name    = "cad_app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "simlux"
path = "src/main.rs"

[dependencies]
cad_kernel = { path = "../cad_kernel" }
cad_io     = { path = "../cad_io" }
cad_wall   = { path = "../cad_wall" }
cad_raster = { path = "../cad_raster" }
cad_param  = { path = "../cad_param" }
serde      = { version = "1", features = ["derive"] }   # SIMLUX sidecar (drawing.simlux.json)
# `float_roundtrip` IS NOT DECORATION HERE. serde_json's default float parser is fast and is NOT
# always correctly rounded — it can hand back a value one ULP from the one that was written.
# Writing is exact, so a number survives being saved and comes back very slightly different, which
# is the kind of drift nobody notices and nobody can explain: a stored calculation reloaded with a
# minimum of 11.000000000000002 lx instead of 11, a sidecar dimension that moves in its last digit
# each time a project is opened and closed. Caught by the stored-result round trip, which compares
# the restored figures BIT FOR BIT against the ones the calculation produced.
serde_json = { version = "1", features = ["float_roundtrip"] }
cad_light  = { path = "../cad_light" }   # SIMLUX lighting engine (IES + lux + Document extrude)
# 3D_FACTORY: the 3D solid layer (Model/Feature/Plane/Frame + parametric CSG via csgrs) and
# the 3D modifiers. UI-agnostic, so the app drives it the same way it drives cad_light.
# This dep is the point of 3D_Factory: 3D lives HERE, where all 31.8k lines of 2D drafting
# and modify already work — so every plane gets the FULL 2D toolset by construction, with
# nothing reimplemented. See `mentor MD/VENUE_DECISION_2D_ON_EVERY_PLANE.md`.
cad_solid  = { path = "../cad_solid" }
glam       = "0.29"                       # SIMLUX 3D camera math (same version cad_light uses)
miniz_oxide = "0.8"                       # zlib inflate for FBX binary arrays (furniture import); already in tree via image/png
# `hdr` + `exr` are what make IMAGE-BASED LIGHTING possible at all: an 8-bit PNG cannot carry a sun
# ten thousand times brighter than the sky beside it, and that ratio IS the lighting. They are also
# the two formats HDRI libraries actually ship (Poly Haven gives you both).
image      = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "hdr", "exr"] }
arboard    = "3"                          # read images from the OS clipboard (paste-as-texture); already in tree via egui-winit
base64     = "0.22"                        # compact texture blobs in the sidecar (PNG bytes → base64)
# Base eframe features shared across platforms. The Linux windowing backends
# (wayland/x11) are added only on Linux below — on Windows eframe uses the
# native Win32 backend automatically and those crates don't compile.
eframe     = { version = "0.30", default-features = false, features = ["default_fonts", "glow"] }
egui       = "0.30"
egui_glow  = "0.30"
glow       = "0.14"
# Logo: SVG (vector → crisp at any size) via resvg; PNG fallback uses the
# `image` dependency above (its feature set already includes "png").
resvg      = { version = "0.44", default-features = false }

# Linux-only windowing backends (the original Arch Linux build used these).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.30", default-features = false, features = ["wayland", "x11"] }
