[package]
name    = "cad_cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cad_cli"
path = "src/main.rs"

[dependencies]
cad_kernel = { path = "../cad_kernel" }
# WP-SCRIPT slice 2: headless `py` runs on the same engine + ScriptOp queue
# as the GUI (needs a CPython 3.11+ runtime present at load — see
# PYTHON_SCRIPTING.md "Deployment").
cad_script = { path = "../cad_script" }
# P4: headless `rasm.save(path)` writes real .rsm / .dxf files.
cad_io = { path = "../cad_io" }
