[package]
name = "cad_solid"
version = "0.1.0"
edition = "2021"
description = "SIMLUX free-3D solid modeler — parametric CSG (csgrs) sandbox, wired into the app later"

[dependencies]
cad_kernel = { path = "../cad_kernel" }   # reuse the 2D geometry + draw constructors + tessellation
# crates.io csgrs 0.16–0.20 are all unbuildable: they hard-pin `core2 ^0.4`, whose
# only release (0.4.0) is YANKED. The maintainer's main (→ 0.21.0) fixes it, so pin
# that commit. Minimal features: `mesh` (BSP Mesh + booleans) + `f64` (the Real
# scalar; also pulls parry/rapier, unavoidable). No STL/DXF/SVG/image/text IO.
csgrs = { git = "https://github.com/timschmidt/csgrs", rev = "5e7a37a8803d4e56617734687edc9b98f4ebeed7", default-features = false, features = ["f64", "mesh", "earcut"] }
# `earcut`: csgrs's `sketch` module compiles unconditionally and its triangulation
# fns are body-gated on a backend feature (earcut|delaunay). Without one they're
# empty → type errors. earcut (earcutr) is the light choice; delaunay pulls spade.
glam     = "0.29"
nalgebra = "0.34"                        # MUST match csgrs's nalgebra (Matrix4<f64> at the CSG boundary)
serde    = { version = "1", features = ["derive"] }
# csgrs (pure-Rust BSP CSG) added via `cargo add` so the version pins correctly.

[features]
# ON BY DEFAULT, on measurements taken both ways.
#
# Synthetic (`tests/boolean_cost.rs`): a 96-point traced wall with 24 windows in it evaluated in
# 8,585 ms without and 87 ms with — 99x. A single window on a 240-point wall: 778 ms -> 30 ms.
#
# And on a REAL project (the 172-feature gym plan, via the `scene_of_real_project` harness):
#
#     total eval        1,759 ms  ->  165 ms      10.7x
#     of which cutting  1,686 ms  ->  109 ms      15.5x   (96% of eval -> 66%)
#     triangles           10,275  ->  5,623       45% fewer, for the same solid
#     deepest operand  2,690 poly ->  1,193 poly  56% shallower
#
# THE LAST ROW IS NOT A PERFORMANCE NUMBER. `Model::eval` runs on a 64 MB thread because csgrs's
# BSP recurses about once per polygon on a convex body, and the deepest single mesh fed to a
# boolean is what decides how close an evaluation comes to the stack. Halving it halves the
# exposure that thread exists to cover.
#
# Fewer triangles for the same solid is not a rounding artefact either: polygons the partition can
# prove are untouched stop being split by a BSP that had no business splitting them.
#
# Opt OUT with `--no-default-features` to reproduce the old numbers.
default = ["bbopt"]

# BOUNDING-BOX PRE-PARTITION for every mesh boolean. csgrs splits each mesh into the polygons
# whose bounding box meets the other mesh's, and the ones that cannot possibly be touched by it;
# only the first group is built into a BSP, and the rest are appended to the result untouched.
#
# Sound rather than approximate — a polygon that does not overlap the other solid's bounding box
# cannot be split by it — and it is exactly the shape this app builds: a 1.2 m window cutter
# against a traced facade meets a handful of the wall's polygons and none of the rest.
#
# Measured by `tests/boolean_cost.rs`; the numbers either way are recorded there.
bbopt = ["csgrs/mesh-bbopt"]

# The standalone sandbox window is an EXAMPLE, so egui/eframe are dev-deps only —
# `cad_solid` itself (lib) is UI-agnostic. Mirrors cad_app's eframe feature set.
[dev-dependencies]
# `Feature::enabled` must default to TRUE on load, and `bool::default()` is FALSE — proving that a
# project saved before the flag existed still opens with its geometry takes real deserialisation.
serde_json = "1"
eframe    = { version = "0.30", default-features = false, features = ["default_fonts", "glow"] }
egui      = "0.30"
egui_glow = "0.30"

[target.'cfg(target_os = "linux")'.dev-dependencies]
eframe = { version = "0.30", default-features = false, features = ["wayland", "x11"] }
